# Redis configuration file optimized for BullMQ and a Node.js application

# Bind to all interfaces (useful for Docker/Podman)
bind 0.0.0.0

# Enable protected mode for security in non-production environments
protected-mode yes

# Redis port (default)
port 6379

# Logging - set to verbose for development or warning for production
loglevel warning

# ------------------------------------------------------------------------
# MEMORY MANAGEMENT
# ------------------------------------------------------------------------

# Set a memory limit for Redis to avoid out-of-memory crashes
# Adjusted to 1GB to handle more jobs in BullMQ
maxmemory 1gb

# Eviction policy: remove the least recently used keys when maxmemory is reached
# BullMQ stores jobs in sorted sets, so you want to prioritize memory usage.
maxmemory-policy allkeys-lru

# Disable Redis persistence for better performance if you don't need to persist job data
# (BullMQ automatically retries failed jobs, so you might not need persistent storage.)
# If persistence is needed, uncomment these:
# Save the DB if 1 key changed in 900 seconds
save 900 1
# Save the DB if 10 keys changed in 300 seconds
save 300 10
# Save the DB if 10000 keys changed in 60 seconds
save 60 10000

# Location of persistent data
dir /var/lib/redis

# ------------------------------------------------------------------------
# AOF (Append Only File)
# ------------------------------------------------------------------------

# If persistence is important (i.e., to recover jobs after a crash),
# you should enable Append Only File (AOF) mode.
# AOF ensures data durability by logging every write operation.

appendonly yes
appendfilename "appendonly.aof"
# Every second offers a good balance between performance and durability
appendfsync everysec

# ------------------------------------------------------------------------
# NETWORK SETTINGS
# ------------------------------------------------------------------------

# Number of simultaneous clients Redis will handle
# Adjust based on your application's requirements (default is 10000)
maxclients 10000

# Keep alive time for Redis connections (in seconds)
tcp-keepalive 300

# ------------------------------------------------------------------------
# LATENCY OPTIMIZATIONS
# ------------------------------------------------------------------------

# Avoid latency spikes during background saving operations
# In environments with heavy job processing, this helps prevent delays.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ------------------------------------------------------------------------
# BULLMQ JOB HANDLING
# ------------------------------------------------------------------------

# Speed up BullMQ job handling by avoiding fragmentation issues
# Adjust Redis frequency to balance between responsiveness and performance
hz 10

# ------------------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------------------

# Require a password for accessing Redis (optional but recommended)
# Uncomment the following line and set your own strong password:
# requirepass "your-secure-password"

# ------------------------------------------------------------------------
# MONITORING AND PERFORMANCE
# ------------------------------------------------------------------------

# Redis slow log, to detect long-running queries (useful for debugging)
# Log queries that take longer than 10ms
slowlog-log-slower-than 10000
# Keep a max of 128 slow queries
slowlog-max-len 128

# Enable Redis statistics on memory usage for BullMQ job monitoring
activerehashing yes
