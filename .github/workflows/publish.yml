name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "scripts/**"

permissions: {}

jobs:
  check-release:
    name: Check Existing Release
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check.outputs.release_exists }}
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if version already has a release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Version aus der package.json auslesen
          HEAD_VERSION=$(jq -r '.version' package.json)
          TAG="v${HEAD_VERSION}"

          echo "Prüfe, ob ein Release für den Tag $TAG existiert..."

          # Nutze die GitHub CLI (gh), um nach dem Release zu suchen
          # Leite Fehler ins Nichts um (> /dev/null 2>&1), falls das Release nicht existiert
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits. Setze release_exists=true."
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG existiert noch nicht. Setze release_exists=false."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.release_exists == 'false'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get Version
        run: |
          set -e
          # read application version from package.json
          HEAD_VERSION=$(git show HEAD:package.json | jq -r '.version')
          echo "VERSION=v${HEAD_VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          generate_release_notes: true

  build:
    name: Build
    needs:
      - create-draft-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: armv7l
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: ia32
    runs-on: "${{ matrix.os }}"
    permissions:
      actions: write
      contents: read
    environment: release
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          package-manager-cache: false
      - run: npm install --immutable

      - name: Install dependencies (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: sudo apt-get update && sudo apt install rpm squashfs-tools

      - name: Build (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - name: Build (Windows)
        if: ${{ startsWith(matrix.os, 'windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - name: Build (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: out

  release:
    name: Release
    runs-on: ubuntu-latest
    # Auch dieser Job wird automatisch übersprungen, falls 'build' übersprungen wird.
    needs:
      - build
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.x"
          package-manager-cache: false

      - run: npm install --immutable

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Publish to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --from-dry-run
