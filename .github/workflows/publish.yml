name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "scripts/**"

permissions: {}

jobs:
  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get Version
        run: |
          set -e
          # read application version from package.json
          HEAD_VERSION=$(git show HEAD:package.json | jq -r '.version')
          echo "VERSION=v${HEAD_VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          generate_release_notes: true

  build:
    name: Build
    needs:
      - create-draft-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: armv7l
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: ia32
    runs-on: "${{ matrix.os }}"
    permissions:
      actions: write
      contents: read
    environment: release
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          package-manager-cache: false
      - run: npm install --immutable

      - name: Install dependencies (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: sudo apt-get update && sudo apt install rpm squashfs-tools

      # TODO: Add macOS signing back in once I have a proper signing certificate for macOS
      # - name: Load certificates (macOS)
      #   if: ${{ startsWith(matrix.os, 'macos-') }}
      #   env:
      #     MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      #     MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      #   run: chmod +x tools/add-macos-cert.sh && . ./tools/add-macos-cert.sh

      # TODO: Add Windows signing back in once I have a proper signing certificate for Windows
      # - name: Signing Manager Setup (Windows)
      #   if: ${{ startsWith(matrix.os, 'windows-') }}
      #   uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1

      # - name: Write authentication cert to disk (Windows)
      #   if: ${{ startsWith(matrix.os, 'windows-') }}
      #   shell: bash
      #   env:
      #     SM_CLIENT_CERT_P12_BASE64: ${{ secrets.SM_CLIENT_CERT_P12_BASE64 }}
      #   run: |
      #     echo "$SM_CLIENT_CERT_P12_BASE64" | base64 --decode > /d/cert.p12
      #     echo "SM_CLIENT_CERT_FILE=D:\\cert.p12" >> "$GITHUB_ENV"

      # - name: Sync cert (Windows)
      #   if: ${{ startsWith(matrix.os, 'windows-') }}
      #   shell: pwsh
      #   env:
      #     CERT_FINGERPRINT: ${{ secrets.CERT_FINGERPRINT }}
      #     KEYPAIR_ALIAS: ${{ secrets.KEYPAIR_ALIAS }}
      #     SM_API_KEY: ${{ secrets.SM_API_KEY }}
      #     SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
      #     SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      #     SM_HOST: ${{ secrets.SM_HOST }}
      #   run: |
      #     smksp_registrar list
      #     smctl windows certsync --keypair-alias=$env:KEYPAIR_ALIAS

      - name: Build (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        # env:
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - name: Build (Windows)
        if: ${{ startsWith(matrix.os, 'windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        # env:
        #   CERT_FINGERPRINT: ${{ secrets.CERT_FINGERPRINT }}
        #   KEYPAIR_ALIAS: ${{ secrets.KEYPAIR_ALIAS }}
        #   SM_API_KEY: ${{ secrets.SM_API_KEY }}
        #   SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
        #   SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        #   SM_HOST: ${{ secrets.SM_HOST }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - name: Build (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --arch=${{ matrix.arch }} --dry-run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: out

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.x"
          package-manager-cache: false

      - run: npm install --immutable

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Publish to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.RBTC_AUDIO_CONVERTER_PUBLISH_GITHUB_TOKEN }}
        run: npm run publish -- --from-dry-run
