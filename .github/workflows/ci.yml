---
name: CI

on:
  push:
    branches-ignore:
      - master

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install modules
        run: npm install
        working-directory: docs

      - name: Run tsc
        run: npm run typecheck
        working-directory: docs

  electron-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install modules
        run: npm install

      - name: Run lint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install modules
        run: npm install

      - name: Run unit tests with coverage
        run: npm run test:coverage

  electron-build:
    name: Run Electron Forge Make
    needs:
      - electron-lint
      - unit-tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: armv7l
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: ia32
    runs-on: "${{ matrix.os }}"
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          package-manager-cache: false
      - run: npm install --immutable

      - name: Build (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: npm run make

      - name: Build (Windows)
        if: ${{ startsWith(matrix.os, 'windows-') }}

        run: npm run make

      - name: Build (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: npm run make
