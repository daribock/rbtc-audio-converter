name: version-check

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".github/**"

jobs:
  release:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Version diff
        run: |
          HEAD_VERSION=$(git show HEAD:package.json | jq -r '.version')
          MASTER_VERSION=$(git show origin/master:package.json | jq -r '.version')

          if [ "$(printf '%s\n%s\n' "$MASTER_VERSION" "$HEAD_VERSION" | sort -V | tail -n1)" != "$HEAD_VERSION" ]; then
            echo "Version not updated before merging into master"
            exit 1
          else
            echo "Great job, master version $MASTER_VERSION will become $HEAD_VERSION soon"
          fi
