name: version-check

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "scripts/**"

jobs:
  release:
    name: Check Version
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version diff
        run: |
          HEAD_VERSION=$(git show HEAD:package.json | jq -r '.version')
          MASTER_VERSION=$(git show origin/master:package.json | jq -r '.version')

          if [ "$HEAD_VERSION" = "$MASTER_VERSION" ]; then
            echo "Version not updated before merging into master"
            exit 1
          else
            echo "Great job, master version $MASTER_VERSION will become $HEAD_VERSION soon"
          fi
