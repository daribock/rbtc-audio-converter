version: "3.8"

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - ./data:/var/lib/redis # Persist data
    environment:
      - REDIS_REPLICATION_MODE=master
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    networks:
      - rbtc-convertor-network

  node-api:
    build:
      context: . # Assumes Dockerfile is in the same directory
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis # Reference Redis service by name
      - REDIS_PORT=6379
    volumes:
      - ./logs:/usr/src/app/logs
    depends_on:
      - redis
    networks:
      - rbtc-convertor-network

networks:
  rbtc-convertor-network:
    name: rbtc-convertor-network
    driver: bridge
