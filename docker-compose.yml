version: "3.8"

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6479:6479"
    volumes:
      - ./data:/var/lib/redis # Persist data
    environment:
      - REDIS_REPLICATION_MODE=master
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
