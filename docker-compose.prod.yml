---
version: "3.8"

services:
  redis:
    restart: on-failure
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      # Configuration stored in the 'config' folder
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf

  node-api:
    restart: on-failure
    environment:
      - NODE_ENV=production
