<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rbtc audio converter</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div
      id="loadingOverlay"
      class="loading-overlay hidden"
      role="status"
      aria-live="polite"
      aria-label="Conversion in progress"
      aria-hidden="true"
    >
      <div class="loading-box">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Converting audio... Please wait.</p>
      </div>
    </div>

    <main class="app-container">
      <section class="card">
        <h1>Rbtc audio converter</h1>
        <p class="subtitle">
          Upload a .wav file and enter the required details.
        </p>

        <form id="audioForm" novalidate>
          <label for="wavFile">WAV file</label>
          <input id="wavFile" type="file" accept=".wav,audio/wav" required />

          <label for="teacherAbbr">Teacher abbreviation</label>
          <input
            id="teacherAbbr"
            type="text"
            placeholder="e.g. MM (Max Mustermann)"
            autocomplete="off"
            required
          />

          <label for="city">City abbreviation</label>
          <input
            id="city"
            type="text"
            placeholder="e.g. MN (München)"
            autocomplete="off"
            required
          />

          <label for="subject">Subject abbreviation</label>
          <input
            id="subject"
            type="text"
            placeholder="e.g. CH (Christus der Heiler)"
            autocomplete="off"
            required
          />

          <label for="lesson">Lesson</label>
          <input
            id="lesson"
            type="number"
            placeholder="e.g. 1"
            autocomplete="off"
            required
          />

          <button id="myButton" type="submit">Save Data</button>
        </form>

        <p id="statusMessage" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
