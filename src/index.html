<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rbtc audio converter</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div
      id="loadingOverlay"
      class="loading-overlay hidden"
      role="status"
      aria-live="polite"
      aria-label="Conversion in progress"
      aria-hidden="true"
    >
      <div class="loading-box">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Converting audio... Please wait.</p>
        <div id="loadingStatusList" class="loading-status-list"></div>
        <p id="loadingSummary" class="loading-summary"></p>
      </div>
    </div>

    <main class="app-container">
      <section class="card">
        <h1>Rbtc audio converter</h1>
        <p class="subtitle">
          Upload a .wav file and enter the required details.
        </p>

        <form id="audioForm" novalidate>
          <label for="wavFile">WAV file</label>
          <input
            id="wavFile"
            type="file"
            accept=".wav,audio/wav"
            multiple
            required
          />

          <div id="fileListContainer" class="file-list-container hidden">
            <label>Selected files and lessons</label>
            <div id="fileList" class="file-list" aria-live="polite"></div>
          </div>

          <label for="teacherAbbr">Teacher abbreviation</label>
          <input
            id="teacherAbbr"
            type="text"
            placeholder="e.g. MM"
            autocomplete="off"
            required
          />

          <label for="teacherName">Teacher full name</label>
          <input
            id="teacherName"
            type="text"
            placeholder="e.g. Max Mustermann"
            autocomplete="off"
            required
          />

          <label for="city">City abbreviation</label>
          <input
            id="city"
            type="text"
            placeholder="e.g. MN"
            autocomplete="off"
            required
          />

          <label for="cityName">City full name</label>
          <input
            id="cityName"
            type="text"
            placeholder="e.g. München"
            autocomplete="off"
            required
          />

          <label for="subject">Subject abbreviation</label>
          <input
            id="subject"
            type="text"
            placeholder="e.g. CH"
            autocomplete="off"
            required
          />

          <label for="subjectName">Subject full name</label>
          <input
            id="subjectName"
            type="text"
            placeholder="e.g. Christus der Heiler"
            autocomplete="off"
            required
          />

          <label for="parallelWorkers">Max parallel conversions (1–10)</label>
          <input
            id="parallelWorkers"
            type="number"
            min="1"
            max="10"
            value="2"
            step="1"
            autocomplete="off"
          />

          <button id="myButton" type="submit">Convert files</button>
        </form>

        <p id="statusMessage" class="status" aria-live="polite"></p>
        <button id="openDownloadsBtn" class="hidden" type="button">Open Downloads Folder</button>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
